name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
          else
            echo "No ZIP file found. Using repository files."
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -not -path "*/build/*" | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find . -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.git/*" \
              -not -path "*/build/*" | head -n 1)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: Android Gradle project not found."
              echo "Check that the ZIP contains the Android project files."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
