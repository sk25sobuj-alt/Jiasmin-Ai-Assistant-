name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTE: ubuntu-latest runner-e Android SDK age thekei install kora thake
      # (ANDROID_HOME set kora), tai alada "Set up Android SDK" step dorkar nai.
      # Oi step ta license prompt-e atke giye fail korchilo.

      - name: Set up Gradle (no wrapper needed)
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Jiasmin-Ai-Assistant.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jiasmin-Ai-Assistant-apk
          path: app/build/outputs/apk/debug/Jiasmin-Ai-Assistant.apk
